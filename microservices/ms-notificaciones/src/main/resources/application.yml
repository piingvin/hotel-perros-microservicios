spring:
  application:
    name: ms-notificaciones
  datasource:
    url: jdbc:h2:mem:ms-notificaciones;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
server:
  port: 8089
springdoc:
  swagger-ui:
    path: /swagger-ui.html