# Configuración del Servidor (Alineado con el puerto del docker-compose)
server.port=8080
spring.application.name=ms-reservas

# Configuración de la Base de Datos H2 (En Memoria Fija)
spring.datasource.url=jdbc:h2:mem:reservasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Inicialización y Logs de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar la Consola Web de H2 para Auditoría Remota
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.defer-datasource-initialization=true